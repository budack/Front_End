<main class="pagina">

  <header class="cabecalho">
    <h1>Minha galeria</h1>
    <p>Filmes • Séries • Jogos</p>
    <input type="text" busca [(ngModel)]="busca">
  </header>

  <section class="cards">

    @for (filme of filmesExibidos; track filme.id) {
    <article class="card">
      <div class="card_icon">
        <img [src]="filme.capa" [alt]="filme.titulo" class="img">
      </div>
      <div>
        <h2 class="card_title">
          {{ filme.titulo }}
        </h2>
        <p>
          Gênero: {{ filme.genero }}
        </p>
        <p>
          Nota {{ filme.nota }}
        </p>
        @if (filme.assistido) {
        <span>Assisti</span>
        } @else {
        <span>Assistir</span>
        }
      </div>

    </article>
    }
  </section>
</main>
